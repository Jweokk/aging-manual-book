site_name: The Aging Manual
site_description: What you, or your parents, do next · a practical manual for growing old in China · free, open, updated every quarter
site_url: https://aging.fly2ai.top/en/
docs_dir: book-en
site_dir: build/site-en
repo_url: https://github.com/Jweokk/aging-manual-book
repo_name: GitHub
edit_uri: ""

hooks:
  - tools/mkdocs_hooks.py

# book-en/README.md 是翻译工作用的中英对应表，不面向读者：不进 nav，也不进站点。
# （它和 index.md 都会解析到站根，不排除会直接让 --strict 失败。）
exclude_docs: |
  README.md


theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - toc.follow
    - content.code.copy
  palette:
    - scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - footnotes

extra_css:
  - assets/extra.css?v=db93e5f0

extra_javascript:
  - assets/font-scale.js?v=e5b1d219
  - assets/shelf-counter.js?v=bfaac80a

extra:
  alternate:
    - name: 中文（Chinese）
      link: https://aging.fly2ai.top/
      lang: zh
    - name: English
      link: https://aging.fly2ai.top/en/
      lang: en

nav:
  - "The Aging Manual": index.md
  - "中文版 · Chinese edition": https://aging.fly2ai.top/
  - "GitHub repository": https://github.com/Jweokk/aging-manual-book
  - Start here:
      - "Chapter 0 · How to use this manual": 00-how-to-use-this-book.md
      - "Foreword · Older people are our future selves": 01-foreword-our-parents-are-our-future.md
      - "About this material, and what it does not take on": 02-about-this-book-and-disclaimer.md
  - Part 1 · Build your reserves:
      - "Chapter 1 · Growing Old Does Not Happen in One Day": 03-ch1-growing-old-does-not-happen-in-one-day.md
      - "Chapter 2 · Bone and Muscle Capital: Two Accounts You Can Only Draw From, Never Pay Into": 04-ch2-bone-and-muscle-capital.md
      - "Chapter 3 · Brain and Senses Capital": 05-ch3-brain-and-senses-capital.md
      - "Chapter 4 · Money and Relationships as Capital": 06-ch4-money-and-relationships-capital.md
  - Part 2 · Three warnings to read first:
      - "Chapter 5 · Falls Are the First Turning Point in Later Life": 07-ch5-falls-the-first-turning-point.md
      - "Chapter 6 · More medicine is not better": 08-ch6-more-medicine-is-not-better.md
      - "Chapter 7 · Warning Three: Can't Eat, Can't Swallow, Choking": 09-ch7-cant-eat-cant-swallow-choking.md
      - "Chapter 8 · Three red lines for going to hospital, and the first hour": 10-ch8-three-red-lines-and-the-first-hour.md
  - Part 3 · The awkward subjects, and everyday upkeep:
      - "Chapter 9 · Forgetting: how far from dementia": 11-ch9-forgetting-how-far-from-dementia.md
      - "Chapter 10 · Urine, stool, and dignity": 12-ch10-incontinence-toileting-and-dignity.md
      - "Chapter 11 · Can't sleep, pain, no drive, loneliness": 13-ch11-sleepless-pain-apathy-loneliness.md
      - "Chapter 12 · What to Eat Every Day: Rebuilding the Table at Sixty and Seventy": 14-ch12-what-to-eat-every-day.md
      - "Chapter 13 · How to Move Every Day": 15-ch13-how-to-move-every-day.md
      - "Chapter 14 · Vaccines, screening and checkup reports: only do what is worth doing": 16-ch14-vaccines-screening-and-checkup.md
  - Part 4 · Arranging the home, the money, the people, the authority:
      - "Chapter 15 · Where to live, and who to grow old with": 17-ch15-where-to-live-and-with-whom.md
      - "Chapter 16 · Where the Money Comes From: How the System Pays Your Bills": 18-ch16-where-the-money-comes-from.md
      - "Chapter 17 · Care lands on particular people, and the people giving it should not fall first": 19-ch17-where-the-helpers-come-from.md
      - "Chapter 18 · Phones and scams: get the thing done, don't get taken": 20-ch18-phones-and-scams.md
      - "Chapter 19 · Setting permissions: hand authority over while you are clear-headed": 21-ch19-handing-over-authority.md
      - "Chapter 20 · Growing old together: staggered retirement, all day face to face, and one of you going first": 22-ch20-growing-old-together.md
