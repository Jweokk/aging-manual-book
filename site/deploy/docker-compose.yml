services:
  aging-preview:
    image: nginx:alpine
    container_name: aging-preview
    restart: unless-stopped
    ports:
      - "127.0.0.1:8099:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./security-headers.conf:/etc/nginx/security-headers.conf:ro
